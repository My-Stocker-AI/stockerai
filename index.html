    <!-- Structured data (Schema.org) — baked into static HTML so AI answer engines and
         crawlers read what Stocker AI is, what it costs, and the FAQ without running JS.
         FAQ text mirrors the live landing page (src/pages/Home.tsx landingFAQs). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Stocker AI",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, iOS, Android",
          "url": "https://www.stocker-ai.com/",
          "description": "Phone-based voice-guided picking for vending route operators. Upload a supported route PDF, hear each pick, and keep saved progress synchronized with touch controls.",
          "offers": {
            "@type": "Offer",
            "price": "20.00",
            "priceCurrency": "USD",
            "description": "$20/driver/month for 2-5 drivers, $18 for 6-20, $15 for 21-50. 2 driver minimum. 14-day free trial."
          },
          "featureList": [
            "Voice-guided route picking with touch fallback",
            "Upload verified Parlevel Prekitting Detail route PDFs",
            "Works on a smartphone with optional Bluetooth earbuds",
            "Voice and touch controls for route picking"
          ]
        },
        {
          "@type": "Organization",
          "name": "Stocker AI",
          "url": "https://www.stocker-ai.com/",
          "logo": "https://www.stocker-ai.com/icon-512.png",
          "sameAs": ["https://twitter.com/StockerAI"]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does pricing work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "$20/driver/month for 2-5 drivers, $18 for 6-20 drivers, $15 for 21-50 drivers. Adjust your driver count anytime - changes apply next billing cycle."
              }
            },
            {
              "@type": "Question",
              "name": "Is there a minimum?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "2 driver minimum ($40/month). Each driver can service up to 10 machines per day."
              }
            },
            {
              "@type": "Question",
              "name": "What do I need to get started?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A smartphone, Bluetooth earbuds (optional), and your route PDFs from Parlevel, Nayax, or VendSoft. A laptop makes generating and uploading PDFs easier, but it works from a phone too."
              }
            },
            {
              "@type": "Question",
              "name": "How do I get started?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Upload a supported route PDF, review the parsed route, assign it to a driver, and start picking from a phone. Parlevel Prekitting Detail is the currently verified layout; other formats require setup and review."
              }
            },
            {
              "@type": "Question",
              "name": "What's the trial?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "14 days free with credit card signup. Cancel anytime - no questions asked."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
