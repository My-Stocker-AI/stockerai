name: CI

# The safety net: runs on every push and pull request so a regression
# (like the CORS break or the Start Picking crash) can't reach production silently.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # BLOCKING — a broken build (missing import, syntax error) fails here.
      # This is what would have caught the missing `Settings` import crash.
      - name: Build
        run: npm run build

      # BLOCKING — unit tests must pass (127 today).
      - name: Unit tests (vitest)
        run: npm run test

      # REPORT-ONLY for now — 126 lint errors + 18 hook-dependency warnings exist
      # in the codebase already. Surfaced here so they're visible and can be
      # ratcheted to blocking after a cleanup pass. New hook warnings should be
      # treated as bugs (the Start Picking crash was this class).
      - name: Lint (report-only)
        run: npm run lint || true

      - name: Type-check (report-only)
        run: npx tsc -p tsconfig.app.json --noEmit || true

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # BLOCKING — backend tests must pass (37 today).
      - name: Backend tests
        run: python -m pytest -q

  secrets:
    name: Secret-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BLOCKING — fails if a credentials file gets committed. .env and .mcp.json
      # must never be tracked; secrets belong in the deploy platform's env vars.
      # Report-only for now: known credential files are already tracked and key
      # rotation is deliberately deferred. This surfaces the state on every push
      # without failing the build. Flip the `exit 1` back on after the keys are
      # rotated + the files untracked, so NEW secret commits are then blocked.
      - name: Warn on committed secrets
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.mcp\.json$|KEY.*\.js$' || true)
          if [ -n "$tracked" ]; then
            echo "::warning::Credential files tracked in git (rotation deferred):"
            echo "$tracked"
          else
            echo "No credential files tracked. ✓"
          fi
