name: Deploy Backend (Render)

# Automatic releases are called by CI only after every gate passes. Manual releases must
# name an exact main commit whose required release-gate jobs passed. The Render request pins
# that commit and this workflow waits for a terminal rollout result.
on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact reviewed commit to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character main commit with successful release gates
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate manual release evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          }
          run_id="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$TARGET_SHA" -f status=completed -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | sort_by(.run_attempt) | last | .id // empty')"
          [[ -n "$run_id" ]] || {
            echo "No completed main CI run exists for $TARGET_SHA" >&2
            exit 1
          }
          jobs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" -f per_page=100)"
          for required in "Frontend (build + tests)" "Backend (pytest)" "Secret-leak guard"; do
            jq -e --arg name "$required" \
              'any(.jobs[]; .name == $name and .conclusion == "success")' \
              <<< "$jobs" > /dev/null || {
                echo "Required release gate did not pass: $required" >&2
                exit 1
              }
          done

      - name: Trigger exact Render commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d "$(jq -n --arg commit "$TARGET_SHA" '{clearCache:"do_not_clear",commitId:$commit}')" \
            -o render-deploy.json

          deploy_id="$(jq -r '.id // empty' render-deploy.json)"
          deployed_commit="$(jq -r '.commit.id // empty' render-deploy.json)"
          [[ -n "$deploy_id" && "$deployed_commit" == "$TARGET_SHA" ]] || {
            echo "Render did not accept the requested exact commit" >&2
            exit 1
          }
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"

      - name: Wait for Render rollout
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for attempt in {1..60}; do
            status="$(curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')"
            case "$status" in
              live)
                curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 https://stockerai-api.onrender.com/health > /dev/null
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render rollout ended with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Render rollout did not finish within 10 minutes" >&2
          exit 1
