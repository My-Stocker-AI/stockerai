name: Deploy Frontend (Cloudflare Pages)

# Automatic releases are called by CI only after every gate passes. Manual releases must
# name an exact main commit whose required release-gate jobs passed. Both paths build and
# publish that exact commit rather than whichever commit is newest when the job starts.
on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact reviewed commit to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character main commit with successful release gates
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate manual release evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          }
          run_id="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$TARGET_SHA" -f status=completed -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | sort_by(.run_attempt) | last | .id // empty')"
          [[ -n "$run_id" ]] || {
            echo "No completed main CI run exists for $TARGET_SHA" >&2
            exit 1
          }
          jobs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" -f per_page=100)"
          for required in "Frontend (build + tests)" "Backend (pytest)" "Secret-leak guard"; do
            jq -e --arg name "$required" \
              'any(.jobs[]; .name == $name and .conclusion == "success")' \
              <<< "$jobs" > /dev/null || {
                echo "Required release gate did not pass: $required" >&2
                exit 1
              }
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium (for prerender)
        run: npx playwright install --with-deps chromium

      - name: Build + prerender public pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BACKEND: ${{ secrets.VITE_API_BACKEND }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build:deploy

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name stockerai --branch main --commit-hash "$TARGET_SHA"

      - name: Verify exact public release
        run: |
          expected_asset="$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -n 1)"
          expected_worker_sha="$(sha256sum dist/sw.js | awk '{print $1}')"
          [[ -n "$expected_asset" && -n "$expected_worker_sha" ]] || {
            echo "Could not identify the exact built frontend artifacts" >&2
            exit 1
          }

          for origin in https://www.stocker-ai.com https://stockerai.pages.dev; do
            matched=false
            for attempt in {1..30}; do
              curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
                "$origin/" -o deployed-index.html
              curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
                "$origin/sw.js" -o deployed-sw.js

              deployed_worker_sha="$(sha256sum deployed-sw.js | awk '{print $1}')"
              if grep -Fq "$expected_asset" deployed-index.html \
                  && [[ "$deployed_worker_sha" == "$expected_worker_sha" ]]; then
                matched=true
                break
              fi
              sleep 10
            done

            [[ "$matched" == true ]] || {
              echo "$origin did not publish the exact requested frontend within five minutes" >&2
              exit 1
            }
          done
