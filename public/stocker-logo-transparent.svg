<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <!-- S with Speakers Logo - Transparent Background -->

  <!-- Left speaker bars (short to tall, outside to inside) -->
  <rect x="20" y="42" width="6" height="16" rx="3" fill="#2DD4A8"/>
  <rect x="32" y="32" width="6" height="36" rx="3" fill="#2DD4A8"/>
  <rect x="44" y="20" width="6" height="60" rx="3" fill="#2DD4A8"/>

  <!-- Center stylized S (two interlocking curves) -->
  <!-- Top curve of S -->
  <path d="M95 20
           C130 20 130 50 95 50
           C60 50 60 50 95 50"
        fill="none"
        stroke="#2DD4A8"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- Bottom curve of S -->
  <path d="M145 80
           C110 80 110 50 145 50
           C180 50 180 50 145 50"
        fill="none"
        stroke="#2DD4A8"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- Right speaker bars (tall to short, inside to outside) -->
  <rect x="190" y="20" width="6" height="60" rx="3" fill="#2DD4A8"/>
  <rect x="202" y="32" width="6" height="36" rx="3" fill="#2DD4A8"/>
  <rect x="214" y="42" width="6" height="16" rx="3" fill="#2DD4A8"/>
</svg>
